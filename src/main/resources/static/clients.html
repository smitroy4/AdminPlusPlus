<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>Clients | Admin++</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/css/style.css">
    <script>try{if(localStorage.getItem('admin++-theme')==='dark')document.documentElement.dataset.theme='dark';}catch(e){}</script>
</head>
<body>

<header class="app-header">
    <div class="app-header__inner">
        <a class="brand" href="/dashboard.html">
            <span class="brand__mark">A++</span>
            <span>Admin++</span>
        </a>

        <nav class="nav" aria-label="Main navigation">
            <a class="nav__link" href="/dashboard.html">Dashboard</a>
            <a class="nav__link" href="/my-tasks.html" data-hide-when-client>My Tasks</a>
            <a class="nav__link" href="/all-tasks.html">All Tasks</a>
            <a class="nav__link" href="/profile.html">Profile</a>
            <a class="nav__link is-hidden" data-role="ADMIN" href="/users.html">Users</a>
            <a class="nav__link is-hidden" data-role="MANAGER" href="/clients.html">Clients</a>
        </nav>

        <div class="app-header__right">
            <div class="user-chip">
                <span class="user-chip__name" data-auth-username>…</span>
                <span class="user-chip__role" data-auth-role></span>
                <span class="avatar" data-auth-avatar>?</span>
            </div>
            <button type="button" class="btn btn--ghost btn--sm" data-logout>Log out</button>
        </div>
    </div>
</header>

<main class="main">
    <div id="clients-error" class="alert" role="alert" aria-live="polite"></div>

    <div id="clients-content">
        <div class="page-head">
            <div>
                <h1>Clients</h1>
                <p>Managers and administrators only - every client company and its contact details.</p>
            </div>
            <div class="page-head__actions">
                <span class="section__hint" id="clients-count">…</span>
            </div>
        </div>

        <section class="section" aria-label="Client companies">
            <div class="card">
                <div class="table-wrap">
                    <table class="table" id="clients-table">
                        <thead>
                        <tr>
                            <th data-sort-key="name">Client<span class="sort-caret">▲</span></th>
                            <th data-sort-key="contactName">Contact<span class="sort-caret">▲</span></th>
                            <th data-sort-key="email">Email<span class="sort-caret">▲</span></th>
                            <th data-sort-key="phone">Phone<span class="sort-caret">▲</span></th>
                            <th>Notes</th>
                        </tr>
                        </thead>
                        <tbody id="clients-body">
                        <tr><td colspan="5" class="muted" style="text-align:center;padding:30px">Loading…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</main>

<footer class="app-foot">Admin++ | Logged in as <span data-auth-footer-user>&hellip;</span></footer>

<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/clients.js"></script>
</body>
</html>
